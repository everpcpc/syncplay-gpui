name: Release

# Publishes a GitHub release when the app version in crates/app/Cargo.toml
# changes on main: the matrix builds first and the release is created only
# after every platform succeeded, so a published release never ships with
# missing assets (the in-app updater polls releases and would hit 404s).
# `gh release create` creates the tag itself, pointing at the triggering commit.
on:
  push:
    branches: [main]
    paths: [crates/app/Cargo.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(grep -m1 '^version' crates/app/Cargo.toml | cut -d'"' -f2)
          PREVIOUS_VERSION=$(git show HEAD^1:crates/app/Cargo.toml 2>/dev/null | grep -m1 '^version' | cut -d'"' -f2 || true)

          echo "Previous version: ${PREVIOUS_VERSION:-<none>}"
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "::notice::no version change, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif gh release view "v$CURRENT_VERSION" > /dev/null 2>&1; then
            echo "::notice::release v$CURRENT_VERSION already exists, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            dmg_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            dmg_arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxkbcommon-x11-dev libxcb-xkb-dev libwayland-dev libvulkan-dev libfontconfig-dev libasound2-dev libssl-dev

      - name: Install librsvg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install librsvg

      - name: Build app
        run: cargo build --release -p syncplay --target ${{ matrix.target }}

      - name: Sign and package macOS app + DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bash packaging/macos/package.sh \
            target/${{ matrix.target }}/release/syncplay \
            ${{ needs.version.outputs.version }} \
            dist \
            ${{ matrix.dmg_arch }}

      - name: Package updater archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist/syncplay
          cp target/${{ matrix.target }}/release/syncplay dist/syncplay/
          tar -czf syncplay_${{ matrix.target }}.tar.gz -C dist syncplay

      - name: Package updater archive + installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist/syncplay
          cp target/${{ matrix.target }}/release/syncplay.exe dist/syncplay/
          Compress-Archive -Path dist/syncplay -DestinationPath syncplay_${{ matrix.target }}.zip
          cp target/${{ matrix.target }}/release/syncplay.exe packaging/windows/syncplay.exe
          # NSIS is not in the runner image anymore; chocolatey provides it.
          choco install nsis --no-progress -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          $outfile = "${{ github.workspace }}\syncplay_x64-setup.exe"
          & $makensis /DVERSION=${{ needs.version.outputs.version }} /DOUTFILE="$outfile" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload artifact (updater archive)
        uses: actions/upload-artifact@v7
        with:
          name: syncplay-${{ matrix.target }}
          path: syncplay_${{ matrix.target }}.${{ matrix.archive }}

      - name: Upload artifact (DMG)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: syncplay-dmg-${{ matrix.dmg_arch }}
          path: dist/syncplay_${{ matrix.dmg_arch }}.dmg

      - name: Upload artifact (Windows installer)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: syncplay-windows-installer
          path: syncplay_x64-setup.exe

  release:
    name: Create Release
    # runs only when every platform build succeeded; a failed build leaves no
    # release and no tag, so a fixed re-run is not blocked by a partial release
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: syncplay-*
          merge-multiple: true
          path: artifacts

      - name: Create Release
        run: gh release create "$TAG" --title "Release $TAG" --generate-notes --target "$GITHUB_SHA" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
