name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(grep -m1 '^version' crates/app/Cargo.toml | cut -d'"' -f2)
          PREVIOUS_VERSION=$(git show HEAD^1:crates/app/Cargo.toml 2>/dev/null | grep -m1 '^version' | cut -d'"' -f2 || true)

          echo "Previous version: ${PREVIOUS_VERSION:-<none>}"
          echo "Current version: $CURRENT_VERSION"

          if [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "Version changed from ${PREVIOUS_VERSION:-<none>} to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          fi

  create-release:
    name: Create Release
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Release v${{ needs.check-version.outputs.new_version }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: [check-version, create-release]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            dmg_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            dmg_arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxkbcommon-x11-dev libxcb-xkb-dev libwayland-dev libvulkan-dev libfontconfig-dev libasound2-dev libssl-dev

      - name: Install librsvg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install librsvg

      - name: Build app
        run: cargo build --release -p syncplay --target ${{ matrix.target }}

      - name: Sign and package macOS app + DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bash packaging/macos/package.sh \
            target/${{ matrix.target }}/release/syncplay \
            ${{ needs.check-version.outputs.new_version }} \
            dist \
            ${{ matrix.dmg_arch }}

      - name: Package updater archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist/syncplay
          cp target/${{ matrix.target }}/release/syncplay dist/syncplay/
          tar -czf syncplay_${{ needs.check-version.outputs.new_version }}_${{ matrix.target }}.tar.gz -C dist syncplay

      - name: Package updater archive + installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist/syncplay
          cp target/${{ matrix.target }}/release/syncplay.exe dist/syncplay/
          Compress-Archive -Path dist/syncplay -DestinationPath syncplay_${{ needs.check-version.outputs.new_version }}_${{ matrix.target }}.zip
          cp target/${{ matrix.target }}/release/syncplay.exe packaging/windows/syncplay.exe
          # NSIS is not in the runner image anymore; chocolatey provides it.
          choco install nsis --no-progress -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          $outfile = "${{ github.workspace }}\syncplay_${{ needs.check-version.outputs.new_version }}_x64-setup.exe"
          & $makensis /DVERSION=${{ needs.check-version.outputs.new_version }} /DOUTFILE="$outfile" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload release asset (updater archive)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          files: syncplay_${{ needs.check-version.outputs.new_version }}_${{ matrix.target }}.${{ matrix.archive }}

      - name: Upload release asset (DMG)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          files: dist/syncplay_${{ needs.check-version.outputs.new_version }}_${{ matrix.dmg_arch }}.dmg

      - name: Upload release asset (Windows installer)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          files: syncplay_${{ needs.check-version.outputs.new_version }}_x64-setup.exe
