[package]
name = "syncplay"
version = "0.12.3"
description = "Syncplay desktop client"
authors = ["everpcpc"]
license = "Apache-2.0"
repository = "https://github.com/everpcpc/syncplay-gpui"
edition = "2021"
build = "build.rs"

[[bin]]
name = "syncplay"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
gpui-kit = "0.7"
syncplay-core = { path = "../core" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-channel = "2"
chrono = "0.4"
rfd = "0.16"
self_update = { version = "1.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
] }
