[package]
name = "syncplay-core"
version = "0.10.10"
description = "Core Syncplay client logic"
authors = ["everpcpc"]
license = "Apache-2.0"
repository = "https://github.com/everpcpc/syncplay-gpui"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
rustls = "0.21"
tokio-rustls = "0.24"
rustls-native-certs = "0.6"
webpki-roots = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
chrono = "0.4"
regex = "1.10"
md-5 = "0.10"
sha2 = "0.10"
shell-words = "1.1"
url = "2.5"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
urlencoding = "2.1"
tempfile = "3.8"
rand = "0.8"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
rcgen = "0.12"
